services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: gigabet
      POSTGRES_PASSWORD: gigabet
      POSTGRES_DB: gigabet
    ports:
      - "5434:5432"
    volumes:
      - gigabet-pg:/var/lib/postgresql/data
      - ./docker/init-test-db.sql:/docker-entrypoint-initdb.d/02-test-db.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U gigabet -d gigabet"]
      interval: 2s
      timeout: 5s
      retries: 20

  api:
    build: .
    environment:
      GIGABET_ARMAZENAMENTO: postgres
      JDBC_URL: jdbc:postgresql://postgres:5432/gigabet
      JDBC_USER: gigabet
      JDBC_PASSWORD: gigabet
      CPF_CHAVE: gigabet-dev-cpf-chave
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy

  frontend:
    build: ./frontend
    environment:
      API_PROXY: http://api:8080
    ports:
      - "5173:5173"
    depends_on:
      - api

volumes:
  gigabet-pg:
